# УДАЛИТЕ ЭТУ СТРОКУ: version: '3.8'

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: program
      POSTGRES_PASSWORD: test
      POSTGRES_DB: ratings
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U program -d ratings"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - db-data:/var/lib/postgresql/data

  rating:
    image: rating-service:latest
    build:
      context: .
      dockerfile: cmd/rating/Dockerfile
    container_name: rating-service
    ports:
      - "8050:8050"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres        # Это имя сервиса в docker-compose
      DB_PORT: 5432
      DB_USER: program
      DB_PASSWORD: test
      DB_NAME: ratings
    command: ["sh", "-c", "./wait-for.sh postgres:5432 -- ./rating"]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8050/manage/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  library:
    image: library-service:latest
    build:
      context: .
      dockerfile: cmd/library/Dockerfile
    container_name: library-service
    ports:
      - "8060:8060"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres        # Это имя сервиса в docker-compose
      DB_PORT: 5432
      DB_USER: program
      DB_PASSWORD: test
      DB_NAME: library-service         # Исправьте если нужно "libraries"
    command: ["sh", "-c", "./wait-for.sh postgres:5432 -- ./library"]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8060/manage/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

# ... остальные сервисы без изменений

volumes:
  db-data: