name: Docker Build and Health Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check project structure
      run: |
        echo "=== Project Structure ==="
        find . -type f -name "*.go" | head -20
        echo "=== pkg directory ==="
        ls -la pkg/ || echo "pkg directory not found"
        echo "=== go.mod ==="
        cat go.mod || echo "go.mod not found"

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23'

    - name: Verify Go modules
      run: |
        go mod tidy
        go mod verify

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build services
      run: |
        docker build -t rating-service:latest -f cmd/rating/Dockerfile .
        docker build -t gateway-service:latest -f cmd/gateway/Dockerfile .
        docker build -t library-service:latest -f cmd/library/Dockerfile .
        docker build -t reservation-service:latest -f cmd/reservation/Dockerfile .

    - name: Verify Docker images
      run: |
        echo "=== Built images ==="
        docker images
        echo "=== Image details ==="
        docker image inspect rating-service:latest --format '{{ .Config.Cmd }}' || true

  health-checks:
    name: Health Checks
    runs-on: ubuntu-latest
    needs: build-images
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Make scripts executable
      run: chmod +x scripts/wait-for.sh scripts/wait-script.sh

    - name: Start services with Docker Compose
      run: docker compose up -d --build

    - name: Check immediate service status
      run: |
        echo "=== Immediate service status after startup ==="
        docker compose ps
        echo "=== Rating service logs (first check) ==="
        docker compose logs rating-service || true
        sleep 5

    - name: Wait for PostgreSQL
      run: |
        echo "Waiting for PostgreSQL..."
        timeout 60 bash -c 'until docker compose exec -T postgres pg_isready -U program -d ratings; do sleep 2; done'
        echo "PostgreSQL is ready"

    - name: Debug rating service startup
      run: |
        echo "=== Monitoring rating service startup ==="
        for i in {1..10}; do
          echo "Check $i:"
          CONTAINER_STATUS=$(docker compose ps rating-service --format json | jq -r '.[].State' 2>/dev/null || echo "unknown")
          echo "Container state: $CONTAINER_STATUS"
          
          if [ "$CONTAINER_STATUS" = "running" ]; then
            echo "Rating service is running"
            break
          elif [ "$CONTAINER_STATUS" = "exited" ]; then
            echo "Rating service has exited"
            docker compose logs rating-service --tail=20
            break
          fi
          
          echo "Waiting for rating service to stabilize (attempt $i/10)"
          sleep 3
        done

    - name: Check rating service details
      run: |
        echo "=== Rating service detailed status ==="
        docker compose ps rating-service
        echo "=== Rating service recent logs ==="
        docker compose logs --tail=30 rating-service || true
        echo "=== Container inspection ==="
        docker inspect rating-service 2>/dev/null | jq '.[] | {State: .State, ExitCode: .State.ExitCode, Error: .State.Error}' || echo "Cannot inspect rating container"

    - name: Test database connectivity
      run: |
        echo "=== Testing database connectivity ==="
        echo "From host:"
        nc -z localhost 5432 && echo "PostgreSQL port is open on host" || echo "PostgreSQL port not available on host"
        
        echo "From postgres container:"
        docker compose exec -T postgres psql -U program -d ratings -c "SELECT version();" && echo "PostgreSQL is responsive" || echo "PostgreSQL not responsive"
        
        echo "From rating container (if running):"
        docker compose exec -T rating-service nc -z postgres 5432 && echo "Rating can reach PostgreSQL" || echo "Rating cannot reach PostgreSQL (container may be stopped)"

    - name: Manual rating service test
      run: |
        echo "=== Trying to run rating service manually ==="
        set +e
        echo "1. Checking files in rating container:"
        docker compose run --rm rating-service ls -la || echo "Cannot run container"
        
        echo "2. Testing binary execution:"
        docker compose run --rm rating-service ./rating &
        MANUAL_PID=$!
        sleep 5
        if ps -p $MANUAL_PID > /dev/null; then
          echo "Manual rating service is running"
          kill $MANUAL_PID
        else
          echo "Manual rating service failed to start"
          wait $MANUAL_PID
          echo "Exit code: $?"
        fi

    - name: Check health endpoints
      run: |
        echo "=== Testing health endpoints ==="
        set +e
        for port in 8050 8060 8070 8080; do
          echo "Testing port $port:"
          curl -f http://localhost:$port/manage/health && echo "Success" || echo "Failed or not ready"
        done

    - name: Show all service logs on failure
      if: failure()
      run: |
        echo "=== COMPLETE SERVICE LOGS ==="
        docker compose logs --tail=200
        echo "=== NETWORK STATUS ==="
        docker network ls
        docker network inspect rsoi_lab_2_default || true
        echo "=== VOLUME STATUS ==="
        docker volume ls

    - name: Show final status
      if: always()
      run: |
        echo "=== FINAL SERVICE STATUS ==="
        docker compose ps -a
        echo "=== RATING SERVICE FULL LOGS ==="
        docker compose logs rating-service || true

    - name: Cleanup
      if: always()
      run: docker compose down