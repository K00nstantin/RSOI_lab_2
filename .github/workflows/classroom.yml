name: Docker Build and Health Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23'

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build services
      run: |
        docker build -t rating-service:latest -f cmd/rating/Dockerfile .
        docker build -t gateway-service:latest -f cmd/gateway/Dockerfile .
        docker build -t library-service:latest -f cmd/library/Dockerfile .
        docker build -t reservation-service:latest -f cmd/reservation/Dockerfile .

    - name: Verify Docker images
      run: docker images

  health-checks:
    name: Health Checks
    runs-on: ubuntu-latest
    needs: build-images
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Make scripts executable
      run: chmod +x scripts/wait-for.sh scripts/wait-script.sh

    - name: Start services with Docker Compose
      run: docker compose up -d --build

    - name: Check service status immediately
      run: |
        echo "=== Initial service status ==="
        docker compose ps
        echo "=== Rating service logs ==="
        docker compose logs rating-service || true
        echo "=== Postgres logs ==="
        docker compose logs postgres || true

    - name: Wait for PostgreSQL
      run: ./scripts/wait-for.sh -t 60 "postgres:5432" -- echo "PostgreSQL is ready"

    - name: Check rating service details
      if: always()
      run: |
        echo "=== Rating service status ==="
        docker compose ps rating-service
        echo "=== Rating service logs (detailed) ==="
        docker compose logs --tail=50 rating-service || true
        echo "=== Rating service container info ==="
        docker inspect rsoi_lab_2-rating-1 || true

    - name: Wait for all microservices
      run: WAIT_PORTS="8050,8060,8070,8080" ./scripts/wait-script.sh

    - name: Test health endpoints
      run: |
        curl -f http://localhost:8050/manage/health || echo "Rating health check failed"
        curl -f http://localhost:8060/manage/health || echo "Library health check failed"
        curl -f http://localhost:8070/manage/health || echo "Reservation health check failed"
        curl -f http://localhost:8080/manage/health || echo "Gateway health check failed"

    - name: Show final service status
      if: always()
      run: |
        echo "=== Final service status ==="
        docker compose ps
        echo "=== All service logs ==="
        docker compose logs --tail=100

    - name: Cleanup
      if: always()
      run: docker compose down