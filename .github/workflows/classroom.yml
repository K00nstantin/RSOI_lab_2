name: Classroom CI

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, develop, master ]
  workflow_dispatch:

jobs:
  classroom-tests:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Debug info
        run: |
          echo "Classroom workflow is running!"
          echo "Event: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref }}"
          
      - name: List all workflow files
        run: find .github/workflows -name "*.yml" -o -name "*.yaml"