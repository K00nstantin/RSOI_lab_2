name: Docker Build and Health Checks

on:
  push:
    branches:
      - master

jobs:
  build-and-test:
    name: Build Images and Check Health
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Docker images
      run: |
        echo "=== Building Rating Service ==="
        docker build -t rating-service:latest -f cmd/rating/Dockerfile .
        
        echo "=== Building Gateway Service ==="
        docker build -t gateway-service:latest -f cmd/gateway/Dockerfile .
        
        echo "=== Building Library Service ==="
        docker build -t library-service:latest -f cmd/library/Dockerfile .
        
        echo "=== Building Reservation Service ==="
        docker build -t reservation-service:latest -f cmd/reservation/Dockerfile .
        
        echo "=== Build completed ==="
        docker images | grep -E "(rating|gateway|library|reservation)-service"

    - name: Start all services
      run: |
        echo "=== Starting all services ==="
        docker compose up -d
        
        echo "=== Waiting for services to initialize ==="
        sleep 45
        
        echo "=== Service status ==="
        docker compose ps

    - name: Health checks
      run: |
        echo "=== Health Checks ==="
        
        echo "1. Testing Rating Service (8051):"
        if curl -f --retry 3 --retry-delay 5 http://localhost:8051/manage/health; then
          echo "Rating Service: HEALTHY"
        else
          echo "Rating Service: UNHEALTHY"
          exit 1
        fi
        
        echo "2. Testing Library Service (8061):"
        if curl -f --retry 3 --retry-delay 5 http://localhost:8061/manage/health; then
          echo "Library Service: HEALTHY"
        else
          echo "Library Service: UNHEALTHY"
          exit 1
        fi
        
        echo "3. Testing Reservation Service (8071):"
        if curl -f --retry 3 --retry-delay 5 http://localhost:8071/manage/health; then
          echo "Reservation Service: HEALTHY"
        else
          echo "Reservation Service: UNHEALTHY"
          exit 1
        fi
        
        echo "4. Testing Gateway Service (8081):"
        if curl -f --retry 3 --retry-delay 5 http://localhost:8081/manage/health; then
          echo "Gateway Service: HEALTHY"
        else
          echo "Gateway Service: UNHEALTHY"
          exit 1
        fi
        
        echo "=== All health checks passed! ==="

    - name: Quick API test
      run: |
        echo "=== Quick API Tests ==="
        
        # Test Rating API
        echo "Testing Rating API:"
        curl -f "http://localhost:8051/api/v1/rating?username=testuser" && echo "Rating API: WORKING" || echo "Rating API: FAILED"
        
        # Test Library API
        echo "Testing Library API:"
        curl -f "http://localhost:8061/api/v1/libraries" && echo "Library API: WORKING" || echo "Library API: FAILED"
        
        # Test Reservation API
        echo "Testing Reservation API:"
        curl -f "http://localhost:8071/api/v1/reservations" -H "X-User-Name: testuser" && echo "Reservation API: WORKING" || echo "Reservation API: FAILED"
        
        # Test Gateway API
        echo "Testing Gateway API:"
        curl -f "http://localhost:8081/api/v1/rating" -H "X-User-Name: testuser" && echo "Gateway API: WORKING" || echo "Gateway API: FAILED"

    - name: Final status
      if: always()
      run: |
        echo "=== Final container status ==="
        docker compose ps
        
        echo "=== Service logs overview ==="
        for service in postgres rating library reservation gateway; do
          echo "--- $service logs (last 5 lines) ---"
          docker compose logs --tail=5 $service || echo "No logs for $service"
        done

    - name: Cleanup
      if: always()
      run: |
        echo "=== Cleaning up ==="
        docker compose down -v
        docker system prune -f