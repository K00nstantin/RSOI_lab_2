health-checks:
  name: Health Checks
  runs-on: ubuntu-latest
  needs: build-images
  
  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Make scripts executable
      run: chmod +x scripts/wait-for.sh scripts/wait-script.sh

    - name: Start services with Docker Compose
      run: docker compose up -d --build

    - name: Check immediate service status
      run: |
        echo "=== Immediate service status ==="
        docker compose ps
        echo "=== Rating service logs ==="
        docker compose logs rating-service || true
        sleep 10

    - name: Wait for PostgreSQL
      run: |
        echo "Waiting for PostgreSQL..."
        timeout 60 bash -c 'until docker compose exec postgres pg_isready -U program -d ratings; do sleep 2; done'

    - name: Debug rating service
      run: |
        echo "=== Checking rating service state ==="
        docker compose ps rating-service
        echo "=== Rating service detailed logs ==="
        docker compose logs --tail=50 rating-service || true
        echo "=== Checking if rating container exists ==="
        docker ps -a | grep rating || echo "Rating container not found"
        echo "=== Checking container exit code ==="
        docker compose logs rating-service 2>&1 | tail -20 || true

    - name: Check database connectivity from rating service
      run: |
        echo "=== Testing DB connection from rating container ==="
        docker compose exec -T rating-service /bin/sh -c "nc -z postgres 5432 && echo 'DB port is reachable' || echo 'DB port NOT reachable'" || echo "Cannot exec into rating container"

    - name: Inspect rating service container
      if: always()
      run: |
        echo "=== Inspecting rating container ==="
        docker inspect rating-service || true
        echo "=== Checking container exit code ==="
        docker compose ps rating-service --format json | jq '.[] | {Service: .Service, State: .State, ExitCode: .ExitCode}' || true

    - name: Test rating service manually
      run: |
        echo "=== Trying to start rating service manually ==="
        docker compose run --rm rating-service ./rating || \
        docker compose run --rm rating-service /bin/sh -c "ls -la && pwd && echo '=== Binary exists? ===' && ls -la rating && echo '=== Trying to run ===' && ./rating" || \
        echo "Manual start failed"

    - name: Show all service logs
      if: always()
      run: |
        echo "=== ALL SERVICE LOGS ==="
        docker compose logs --tail=100

    - name: Cleanup
      if: always()
      run: docker compose down