name: Docker Build and Health Checks

on:
  push:
    branches:
      - master

jobs:
  build-and-test:
    name: Build Images and Check Health
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Remove version from docker-compose
      run: sed -i '/^version:/d' docker-compose.yml

    - name: Build Docker images
      run: |
        docker build -t rating-service:latest -f cmd/rating/Dockerfile .
        docker build -t gateway-service:latest -f cmd/gateway/Dockerfile .
        docker build -t library-service:latest -f cmd/library/Dockerfile .
        docker build -t reservation-service:latest -f cmd/reservation/Dockerfile .

    - name: Start all services and wait
      run: |
        docker compose up -d
        sleep 120
        docker compose ps

    - name: Show initialized databases
      run: |
        echo "=== Initialized Databases ==="
        docker compose exec -T postgres psql -U program -d postgres -c "\l"

    - name: Health checks
      run: |
        curl -f http://localhost:8051/manage/health && echo "Rating: HEALTHY" || echo "Rating: UNHEALTHY"
        curl -f http://localhost:8061/manage/health && echo "Library: HEALTHY" || echo "Library: UNHEALTHY"
        curl -f http://localhost:8071/manage/health && echo "Reservation: HEALTHY" || echo "Reservation: UNHEALTHY"
        curl -f http://localhost:8081/manage/health && echo "Gateway: HEALTHY" || echo "Gateway: UNHEALTHY"

    - name: API tests
      run: |
        curl -f "http://localhost:8051/api/v1/rating?username=testuser" && echo "Rating API: OK" || echo "Rating API: FAILED"
        curl -f "http://localhost:8061/api/v1/libraries" && echo "Library API: OK" || echo "Library API: FAILED"
        curl -f "http://localhost:8071/api/v1/reservations" -H "X-User-Name: testuser" && echo "Reservation API: OK" || echo "Reservation API: FAILED"
        curl -f "http://localhost:8081/api/v1/rating" -H "X-User-Name: testuser" && echo "Gateway API: OK" || echo "Gateway API: FAILED"

    - name: Cleanup
      if: always()
      run: docker compose down -v