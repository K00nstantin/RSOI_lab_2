name: GitHub Classroom Workflow

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker images
      run: |
        docker compose build

    - name: Start services
      run: |
        docker compose up -d

    - name: Wait for services to be healthy
      run: |
        echo "Waiting for services to start..."
        export WAIT_PORTS="8050,8060,8070,8080"
        chmod +x scripts/wait-script.sh
        scripts/wait-script.sh

    - name: Test health endpoints
      run: |
        echo "Testing health endpoints..."
        
        # Test rating service
        echo "Testing rating service (8050)..."
        curl -f http://localhost:8050/manage/health || exit 1
        
        # Test library service
        echo "Testing library service (8060)..."
        curl -f http://localhost:8060/manage/health || exit 1
        
        # Test reservation service
        echo "Testing reservation service (8070)..."
        curl -f http://localhost:8070/manage/health || exit 1
        
        # Test gateway service
        echo "Testing gateway service (8080)..."
        curl -f http://localhost:8080/manage/health || exit 1
        
        echo "All health checks passed!"

    - name: Install Newman
      run: |
        npm install -g newman

    - name: Run integration tests
      run: |
        echo "Running integration tests with Postman..."
        newman run v4/postman/collection.json \
          -e v4/postman/environment.json \
          --reporters cli \
          --bail || exit 1
        echo "Integration tests passed!"

    - name: Show service logs on failure
      if: failure()
      run: |
        docker compose logs

    - name: Cleanup
      if: always()
      run: |
        docker compose down -v

