name: Debug Workflow

on: 
  push:
    branches: [main, develop]
  workflow_dispatch:  # Позволяет запускать вручную

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: List files
        run: |
          echo "Project structure:"
          find . -type f -name "*.yml" -o -name "*.yaml" -o -name "Dockerfile" -o -name "*.sh" | head -20
          
      - name: Check scripts
        run: |
          ls -la wait-for.sh wait-script.sh 2>/dev/null || echo "Scripts not found"
          which docker-compose || echo "docker-compose not found"
          
      - name: Simple test
        run: echo "If you see this, workflow is working!"