name: Docker Microservices CI

on:
  push:
    branches:
      - master

jobs:
  build:
    name: Build Services
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Docker images
      run: |
        docker build -t rating-service:latest -f cmd/rating/Dockerfile .
        docker build -t gateway-service:latest -f cmd/gateway/Dockerfile .
        docker build -t library-service:latest -f cmd/library/Dockerfile .
        docker build -t reservation-service:latest -f cmd/reservation/Dockerfile .

  test:
    name: Test Services
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Debug file structure
      run: |
        echo "=== Current directory ==="
        pwd
        echo "=== Files in current directory ==="
        ls -la
        echo "=== Looking for docker-compose.yml ==="
        find . -name "docker-compose.yml" -type f

    - name: Build Docker images
      run: |
        # Строим из текущей директории (где уже находится весь код)
        docker build -t rating-service:latest -f cmd/rating/Dockerfile .
        docker build -t gateway-service:latest -f cmd/gateway/Dockerfile .
        docker build -t library-service:latest -f cmd/library/Dockerfile .
        docker build -t reservation-service:latest -f cmd/reservation/Dockerfile .

    - name: Start services with Docker Compose
      run: |
        # Просто используем docker compose без указания пути
        # Так как мы уже в правильной директории
        docker compose up -d
        sleep 10
        # Проверяем запущенные контейнеры
        echo "=== Running containers ==="
        docker ps -a

    - name: Wait for services to be ready
      run: |
        sleep 30
        
        # Проверяем логи сервисов
        echo "=== Service logs ==="
        docker compose logs --tail=20
    - name: Health checks
      run: |
        echo "=== Health Checks ==="
        curl -f http://localhost:8050/manage/health && echo "Rating healthy" || echo "Rating unhealthy"
        curl -f http://localhost:8060/manage/health && echo "Library healthy" || echo "Library unhealthy"
        curl -f http://localhost:8070/manage/health && echo "Reservation healthy" || echo "Reservation unhealthy"
        curl -f http://localhost:8080/manage/health && echo "Gateway healthy" || echo "Gateway unhealthy"

    - name: API tests
      run: |
        echo "=== API Tests ==="
        curl -f "http://localhost:8050/api/v1/rating?username=testuser" && echo "Rating API works" || echo "Rating API failed"
        curl -f "http://localhost:8060/api/v1/libraries" && echo "Library API works" || echo "Library API failed"
        curl -f "http://localhost:8070/api/v1/reservations" -H "X-User-Name: testuser" && echo "Reservation API works" || echo "Reservation API failed"
        curl -f "http://localhost:8080/api/v1/rating" -H "X-User-Name: testuser" && echo "Gateway API works" || echo "Gateway API failed"

    - name: Cleanup
      if: always()
      run: |
        docker compose down -v