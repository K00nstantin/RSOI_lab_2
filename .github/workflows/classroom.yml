name: Docker Microservices CI

on:
  push:
    branches:
      - master

jobs:
  build:
    name: Build Services
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Docker images
      run: |
        docker build -t rating-service:latest -f cmd/rating/Dockerfile .
        docker build -t gateway-service:latest -f cmd/gateway/Dockerfile .
        docker build -t library-service:latest -f cmd/library/Dockerfile .
        docker build -t reservation-service:latest -f cmd/reservation/Dockerfile .

  test:
    name: Test Services
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Start and test services
      run: |
        docker compose up -d
        sleep 30
        
        # Health checks
        curl -f http://localhost:8050/manage/health && echo "Rating healthy"
        curl -f http://localhost:8060/manage/health && echo "Library healthy"
        curl -f http://localhost:8070/manage/health && echo "Reservation healthy"
        curl -f http://localhost:8080/manage/health && echo "Gateway healthy"

    - name: Cleanup
      if: always()
      run: docker compose down -v