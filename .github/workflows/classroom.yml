name: Docker Build and Health Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23'

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Rating service
      run: |
        docker build -t rating-service:latest -f cmd/rating/Dockerfile .

    - name: Build Gateway service
      run: |
        docker build -t gateway-service:latest -f cmd/gateway/Dockerfile .

    - name: Build Library service
      run: |
        docker build -t library-service:latest -f cmd/library/Dockerfile .

    - name: Build Reservation service
      run: |
        docker build -t reservation-service:latest -f cmd/reservation/Dockerfile .

    - name: Verify Docker images
      run: |
        docker images | grep -E "(gateway|rating|library|reservation)-service"

  health-checks:
    name: Health Checks
    runs-on: ubuntu-latest
    needs: build-images
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Make scripts executable
      run: |
        chmod +x scripts/wait-for.sh
        chmod +x scripts/wait-script.sh

    - name: Start services with Docker Compose
      run: |
        docker compose up -d --build

    - name: Wait for PostgreSQL
      run: |
        ./scripts/wait-for.sh -t 60 "postgres:5432" -- echo "PostgreSQL is ready"
        sleep 15

    - name: Wait for all microservices
      run: |
        WAIT_PORTS="8050,8060,8070,8080" ./scripts/wait-script.sh

    - name: Test basic health endpoints
      run: |
        echo "Testing basic health endpoints..."
        curl -f http://localhost:8050/manage/health && echo "Rating service healthy"
        curl -f http://localhost:8060/manage/health && echo "Library service healthy"
        curl -f http://localhost:8070/manage/health && echo "Reservation service healthy"
        curl -f http://localhost:8080/manage/health && echo "Gateway service healthy"

    - name: Test API functionality
      run: |
        echo "Testing API endpoints..."
        curl -f "http://localhost:8050/api/v1/rating?username=testuser" && echo "Rating API works"
        curl -f "http://localhost:8060/api/v1/libraries?city=Moscow" && echo "Library API works"
        curl -f "http://localhost:8080/api/v1/rating" -H "X-User-Name: testuser" && echo "Gateway API works"
        curl -f "http://localhost:8070/api/v1/reservations" -H "X-User-Name: testuser" && echo "Reservation API works"

    - name: Show service status
      if: always()
      run: |
        docker compose ps
        echo ""
        echo "Recent logs:"
        docker compose logs --tail=20

    - name: Cleanup
      if: always()
      run: docker compose down