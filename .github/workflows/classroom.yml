name: Docker Build and Test

on:
  push:
    branches: [main, develop]

jobs:
  build-and-test:
    name: Build and Test Services
    runs-on: ubuntu-latest
    
    steps:
    # ОБЯЗАТЕЛЬНЫЕ ШАГИ:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Docker images
      run: |
        docker build -t rating-service:latest -f cmd/rating/Dockerfile .
        docker build -t gateway-service:latest -f cmd/gateway/Dockerfile .
        docker build -t library-service:latest -f cmd/library/Dockerfile .
        docker build -t reservation-service:latest -f cmd/reservation/Dockerfile .

    - name: Start and test services
      run: |
        # Запускаем сервисы
        docker compose up -d
        
        # Ждем инициализации
        sleep 30
        
        # Проверяем здоровье
        curl -f http://localhost:8050/manage/health && echo "Rating healthy"
        curl -f http://localhost:8060/manage/health && echo "Library healthy" 
        curl -f http://localhost:8070/manage/health && echo "Reservation healthy"
        curl -f http://localhost:8080/manage/health && echo "Gateway healthy"
        
        # Тестируем API
        curl -f "http://localhost:8050/api/v1/rating?username=testuser" && echo "Rating API works"
        curl -f "http://localhost:8060/api/v1/libraries" && echo "Library API works"
        curl -f "http://localhost:8070/api/v1/reservations" -H "X-User-Name: testuser" && echo "Reservation API works"
        curl -f "http://localhost:8080/api/v1/rating" -H "X-User-Name: testuser" && echo "Gateway API works"

    - name: Cleanup
      if: always()
      run: docker compose down -v